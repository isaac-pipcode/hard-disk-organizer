{#- Ícones das situações do Acervo (e das ações ligadas a elas).
    Uso: {% from "_icones_sit.html" import icone_sit %} ... {{ icone_sit('enviar') }} -#}
{% macro icone_sit(s, tam=None) -%}
<svg class="ico" aria-hidden="true"{% if tam %} style="width:{{ tam }}px;height:{{ tam }}px"{% endif %} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
{%- if s == 'concluido' %}<path d="M5 12l5 5 9-10"/>
{%- elif s == 'incompleta' %}<circle cx="12" cy="12" r="9"/><path d="M10 9v6"/><path d="M14 9v6"/>
{%- elif s == 'completar' %}<circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/>
{%- elif s == 'a_varrer' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif s == 'novo' %}<path d="M12 5v14"/><path d="M5 12h14"/>
{%- elif s == 'enviar' %}<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
{%- elif s == 'conteudo' %}<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
{%- elif s == 'nao_reconhecido' %}<path d="M9 7V3"/><path d="M15 7V3"/><path d="M6 7h12v4a6 6 0 0 1-12 0V7z"/><path d="M12 17v4"/><path d="M3 3l18 18"/>
{%- else %}<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>{% endif %}
</svg>
{%- endmacro %}
