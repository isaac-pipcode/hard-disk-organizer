name: Gerar PreservaScan.exe (Windows)

# Gera o executável independente do painel numa máquina Windows real.
#   - Rode manualmente pela aba "Actions" (botão "Run workflow"), ou
#   - Publique uma tag "v*" (ex.: git tag v0.1.0 && git push --tags) para
#     também anexar o .exe a uma Release.
# O .exe fica disponível como "Artifact" ao final de cada execução.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # necessário para criar a Release ao publicar uma tag

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r scanner/requirements.txt
          pip install pyinstaller==6.11.1

      - name: Embutir Siegfried + MediaInfo + ExifTool (best-effort)
        continue-on-error: true      # se falhar, o .exe sai sem os binários (fallback: pasta/PATH)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # só p/ evitar rate limit na API de releases
        run: |
          New-Item -ItemType Directory -Force -Path packaging/ferramentas | Out-Null
          choco install mediainfo-cli exiftool -y --no-progress
          # Siegfried: NÃO existe pacote no Chocolatey — baixamos o release oficial do
          # GitHub. Além do 'sf.exe', o scanner precisa do arquivo de assinaturas
          # 'default.sig' AO LADO do binário (o scan aponta SIEGFRIED_HOME para a pasta
          # das ferramentas quando encontra o .sig ali). 'sf -update' baixa o .sig para
          # a pasta indicada por SIEGFRIED_HOME. Preferimos o build 'win64_static'
          # (sem dependência de DLL do MSVC), com fallback para 'win64'.
          try {
            $apiHead = @{ "User-Agent" = "preservascan-ci"; "Authorization" = "Bearer $env:GITHUB_TOKEN" }
            $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/richardlehane/siegfried/releases/latest" -Headers $apiHead
            $asset = $rel.assets | Where-Object { $_.name -match "win64_static\.zip$" } | Select-Object -First 1
            if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -match "win64\.zip$" } | Select-Object -First 1 }
            if ($asset) {
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile sf.zip -UseBasicParsing
              Expand-Archive -Path sf.zip -DestinationPath sf_tmp -Force
              $sfbin = Get-ChildItem -Recurse -Path sf_tmp -Filter sf.exe | Select-Object -First 1
              if ($sfbin) {
                Copy-Item $sfbin.FullName packaging/ferramentas/
                $env:SIEGFRIED_HOME = (Resolve-Path packaging/ferramentas).Path
                & "packaging/ferramentas/sf.exe" -update
                if (Test-Path "packaging/ferramentas/default.sig") {
                  Write-Host "Siegfried OK: sf.exe + default.sig ($($rel.tag_name), asset $($asset.name))"
                } else {
                  Write-Host "AVISO: sf.exe copiado mas default.sig nao baixou (sf roda sem identificar formato)"
                }
              } else { Write-Host "AVISO: sf.exe nao encontrado no zip do Siegfried" }
            } else { Write-Host "AVISO: asset Windows do Siegfried nao encontrado no release $($rel.tag_name)" }
          } catch { Write-Host "AVISO: Siegfried falhou: $_" }
          # MediaInfo CLI é um .exe autossuficiente
          $mi = Get-ChildItem -Recurse -Path C:\ProgramData\chocolatey\lib\mediainfo-cli -Filter MediaInfo.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($mi) { Copy-Item $mi.FullName packaging/ferramentas/ ; Write-Host "MediaInfo: $($mi.FullName)" }
          # ExifTool: o exiftool.exe é só um LANÇADOR; precisa da pasta exiftool_files ao
          # lado para funcionar. Copiamos a pasta inteira do build 64-bit.
          $etDir = Get-ChildItem -Directory -Recurse -Path C:\ProgramData\chocolatey\lib\exiftool -Filter "exiftool*_64" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($etDir) { Copy-Item "$($etDir.FullName)\*" packaging/ferramentas/ -Recurse -Force ; Write-Host "ExifTool dir: $($etDir.FullName)" }
          Get-ChildItem -Recurse packaging/ferramentas | Select-Object FullName, Length

      - name: Compilar o executável
        run: pyinstaller packaging/preservascan.spec --noconfirm

      - name: Publicar o .exe como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: PreservaScan-windows
          path: dist/PreservaScan.exe
          if-no-files-found: error

      - name: Anexar o .exe à Release (somente em tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }} dist/PreservaScan.exe
          --title ${{ github.ref_name }}
          --notes "Build automático do painel PRESERVA-SCAN (executável independente para Windows)."
