name: Testes

# Roda os testes a cada push e pull request. É rápido (Linux, sem dependências
# externas): garante que o AGRUPAMENTO do relatório (totais por disco, dedup por
# SHA-256, contagem de formatos e colunas audiovisuais) não regrida.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rodar os testes (agrupamento do relatório + deduplicação)
        run: |
          for t in tests/test_*.py; do
            echo "== $t =="
            python "$t" || exit 1
          done
